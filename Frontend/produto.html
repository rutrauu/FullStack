<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIlk4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Produtos</h1>
        <a class="btn btn-outline-secondary" href="categoria.html">Categorias</a>
      </div>

      <form id="formProduto" class="row g-3 mb-4">
        <input type="hidden" id="idProduto">
        <div class="col-md-5">
          <label class="form-label" for="nomeProduto">Nome</label>
          <input class="form-control" id="nomeProduto" required maxlength="100">
        </div>
        <div class="col-md-3">
          <label class="form-label" for="precoProduto">Preço</label>
          <input class="form-control" id="precoProduto" type="number" min="0" step="0.01" required>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="categoriaProduto">Categoria</label>
          <select class="form-select" id="categoriaProduto" required>
            <option value="">Selecione uma categoria</option>
          </select>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit" id="btnSalvar">Adicionar produto</button>
          <button class="btn btn-secondary d-none" type="button" id="btnCancelar">Cancelar edição</button>
        </div>
      </form>

      <div id="mensagem" class="alert d-none" role="alert"></div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Preço</th>
              <th>Categoria</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="listaProdutos"></tbody>
        </table>
      </div>
    </main>
    <script src="js/produto.js"></script>
  </body>
</html>
